<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Destination Preview</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="title-icon">🔍</div>

        <h1>Destination Preview</h1>

        <div class="divider">
            <span></span>
            <span class="small-link">🔗</span>
            <span></span>
        </div>

        <p>Check the original destination before visiting.</p>

        <div class="result-box">

            <h3>Original Destination</h3>

            <div class="short-link">
                {{ original_url }}
            </div>

            <p>Only continue if you trust this destination.</p>

            <a href="{{ original_url }}" target="_blank"
               rel="noopener noreferrer">
                <button type="button">Continue to Website</button>
            </a>

        </div>

    </div>

</body>
</html>
